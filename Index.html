<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      font-family: Arial, sans-serif;
    }

    .calculadora {
      width: 340px;
      max-width: 95%;
      padding: 20px;
      border-radius: 25px;
      background: #222;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .pantalla {
      width: 100%;
      height: 90px;
      margin-bottom: 15px;
      padding: 15px;
      border-radius: 15px;
      background: #111;
      color: white;
      font-size: 40px;
      text-align: right;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .botones {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 65px;
      border: none;
      border-radius: 15px;
      background: #333;
      color: white;
      font-size: 23px;
      cursor: pointer;
      transition: 0.1s;
    }

    button:active {
      transform: scale(0.94);
    }

    .operador {
      background: #ff9500;
    }

    .limpiar {
      background: #d93636;
    }

    .igual {
      background: #28a745;
    }

    .cero {
      grid-column: span 2;
    }
  </style>
</head>

<body>

  <div class="calculadora">

    <div id="pantalla" class="pantalla">0</div>

    <div class="botones">

      <button class="limpiar" onclick="limpiar()">C</button>
      <button onclick="borrar()">⌫</button>
      <button class="operador" onclick="porcentaje()">%</button>
      <button class="operador" onclick="operador('/')">÷</button>

      <button onclick="numero('7')">7</button>
      <button onclick="numero('8')">8</button>
      <button onclick="numero('9')">9</button>
      <button class="operador" onclick="operador('*')">×</button>

      <button onclick="numero('4')">4</button>
      <button onclick="numero('5')">5</button>
      <button onclick="numero('6')">6</button>
      <button class="operador" onclick="operador('-')">−</button>

      <button onclick="numero('1')">1</button>
      <button onclick="numero('2')">2</button>
      <button onclick="numero('3')">3</button>
      <button class="operador" onclick="operador('+')">+</button>

      <button class="cero" onclick="numero('0')">0</button>
      <button onclick="decimal()">.</button>
      <button class="igual" onclick="calcular()">=</button>

    </div>
  </div>

  <script>
    let pantalla = document.getElementById("pantalla");

    let valorActual = "";
    let valorAnterior = "";
    let operadorActual = "";
    let reiniciarPantalla = false;

    function numero(numero) {
      if (reiniciarPantalla) {
        valorActual = "";
        reiniciarPantalla = false;
      }

      if (valorActual === "0") {
        valorActual = "";
      }

      if (valorActual.length < 15) {
        valorActual += numero;
      }

      actualizarPantalla();
    }

    function decimal() {
      if (reiniciarPantalla) {
        valorActual = "";
        reiniciarPantalla = false;
      }

      if (!valorActual.includes(".")) {
        if (valorActual === "") {
          valorActual = "0";
        }

        valorActual += ".";
      }

      actualizarPantalla();
    }

    function operador(op) {
      if (valorActual === "" && valorAnterior === "") {
        return;
      }

      if (valorAnterior !== "" && valorActual !== "") {
        calcular();
      }

      valorAnterior = valorActual;
      valorActual = "";
      operadorActual = op;
    }

    function calcular() {
      if (
        valorAnterior === "" ||
        valorActual === "" ||
        operadorActual === ""
      ) {
        return;
      }

      let anterior = parseFloat(valorAnterior);
      let actual = parseFloat(valorActual);
      let resultado;

      switch (operadorActual) {
        case "+":
          resultado = anterior + actual;
          break;

        case "-":
          resultado = anterior - actual;
          break;

        case "*":
          resultado = anterior * actual;
          break;

        case "/":
          if (actual === 0) {
            pantalla.textContent = "Error";
            valorActual = "";
            valorAnterior = "";
            operadorActual = "";
            return;
          }

          resultado = anterior / actual;
          break;
      }

      resultado = Number(resultado.toPrecision(12));

      valorActual = resultado.toString();
      valorAnterior = "";
      operadorActual = "";
      reiniciarPantalla = true;

      actualizarPantalla();
    }

    function porcentaje() {
      if (valorActual === "") {
        return;
      }

      valorActual = (parseFloat(valorActual) / 100).toString();

      actualizarPantalla();
    }

    function borrar() {
      if (reiniciarPantalla) {
        valorActual = "";
        reiniciarPantalla = false;
      } else {
        valorActual = valorActual.slice(0, -1);
      }

      actualizarPantalla();
    }

    function limpiar() {
      valorActual = "";
      valorAnterior = "";
      operadorActual = "";
      reiniciarPantalla = false;

      actualizarPantalla();
    }

    function actualizarPantalla() {
      pantalla.textContent = valorActual || "0";
    }

    document.addEventListener("keydown", function(evento) {
      const tecla = evento.key;

      if (!isNaN(tecla)) {
        numero(tecla);
      }

      if (tecla === ".") {
        decimal();
      }

      if (["+", "-", "*", "/"].includes(tecla)) {
        operador(tecla);
      }

      if (tecla === "Enter" || tecla === "=") {
        calcular();
      }

      if (tecla === "Backspace") {
        borrar();
      }

      if (tecla === "Escape") {
        limpiar();
      }

      if (tecla === "%") {
        porcentaje();
      }
    });
  </script>

</body>
</html>
